name: CI

# CI answers "valid?" (mechanical, identical every time). Whether a change is worth landing
# is the landing ticket's call, made by a human. See docs/agents/issue-tracker.md and
# https://github.com/vltnkiz/ticket-dispatch/issues/18.
#
# Runs on PRs into main (the merge gate) and on pushes to worktree-ticket-* branches, so a
# batch sees a failure before it resolves rather than only once its PR is opened.
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so the freeze check re-runs when the user applies `harness-change`
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: ["worktree-ticket-*"]

jobs:
  freeze-check:
    name: harness/ is frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute the diff base
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # No --depth here: checkout already fetched full history (fetch-depth: 0), and a
            # shallow re-fetch of just main's tip can clip it below a branch's real merge-base
            # (seen on a branch that forked before several since-landed main merges), silently
            # emptying `sha` under `bash -e` (a failing command substitution doesn't trip -e).
            # harness/ never legitimately changes on main, so diffing straight against its
            # current tip is equivalent to a merge-base diff here and needs no such fetch.
            git fetch origin main
            echo "sha=origin/main" >> "$GITHUB_OUTPUT"
          fi
      # A harness change is sanctioned only by the user-applied `harness-change` label on the PR
      # (see CONTEXT.md, Harness change). Batches never carry it.
      - name: Fail if harness/ changed (unless the PR is labelled harness-change)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'harness-change') }}
        run: |
          touched=$(git diff --name-only --no-renames "${{ steps.base.outputs.sha }}" -- harness/)
          if [ -n "$touched" ]; then
            echo "harness/ is frozen; this branch touches:" >&2
            echo "$touched" | sed 's/^/  /' >&2
            echo "Research adds components/ and configs/ only. A deliberate harness change needs the user to apply the harness-change label." >&2
            exit 1
          fi

  smoke:
    name: scorer runs (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Harness unit tests (no competition data needed)
        run: uv run python -m unittest discover -s tests -t .
      - name: Generate a synthetic fixture
        run: uv run python -m scripts.gen_ci_fixture "$RUNNER_TEMP/ci-fixture"
      - name: Smoke-score every config
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: |
          for cfg in configs/main.toml configs/exp/*.toml; do
            echo "::group::$cfg"
            uv run python -m harness.score "$cfg" --smoke
            echo "::endgroup::"
          done
      # Every combiner method through every entry point that touches one. Config files are written
      # on the fly (30 iterations: a learned combiner needs all five folds fit, not one).
      - name: Smoke-check the combiner methods
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: |
          for method in logit_mean stack gate; do
            extra=""
            if [ "$method" = gate ]; then extra='segment = "Deck"'; fi
            cfg="$RUNNER_TEMP/combiner.toml"
            cat > "$cfg" <<EOF
          extends = "main"
          [params.catboost]
          iterations = 30
          [combiner]
          method = "$method"
          $extra
          EOF
            echo "::group::$method"
            uv run python -m harness.score "$cfg" --smoke
            uv run python -m scripts.confirm "$cfg" --smoke
            uv run python -m scripts.explain "$cfg" --smoke
            echo "::endgroup::"
          done
      - name: Smoke-check the tuner
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: |
          for m in $(uv run python -m scripts.tune --list-models); do
            echo "::group::tune $m"
            uv run python -m scripts.tune "$m" --smoke
            echo "::endgroup::"
          done
      - name: Smoke-check confirmation-seed scoring
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: uv run python -m scripts.confirm --smoke
      - name: Smoke-check the matrix runner
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: uv run python -m scripts.matrix --smoke
      - name: Smoke-check the explainer
        env:
          SPACESHIP_DATA: ${{ runner.temp }}/ci-fixture
        run: uv run python -m scripts.explain --smoke
